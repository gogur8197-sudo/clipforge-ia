services:
  - type: web
    name: clipforge-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PEXELS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MAX_SCENES
        value: "5"
